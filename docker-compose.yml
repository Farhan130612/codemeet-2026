version: '3.8'

services:
  speedtyper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codemeet_speedtyper
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/codemeet_typing.db
    volumes:
      - speedtyper_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  speedtyper_data:
    driver: local
